{% extends 'base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card form-card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4">
                    <span class="section-pill">Formulario</span>
                    <h2 class="text-success mt-2 mb-0">{{ titulo }}</h2>
                </div>

                <form method="post">
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'mascota_list' %}" class="btn btn-outline-secondary">Volver</a>
                        <button type="submit" class="btn btn-success btn-lg">Guardar</button>
                    </div>
                </form>

                <script>
                    document.addEventListener('DOMContentLoaded', function () {
                        const allowedPattern = /^[A-Za-zÁÉÍÓÚáéíóúÑñÜü\s'-]+$/;
                        document.querySelectorAll('[data-letter-only="true"]').forEach(function (input) {
                            input.addEventListener('keydown', function (event) {
                                const key = event.key;
                                const allowed = ['Backspace', 'Tab', 'Delete', 'ArrowLeft', 'ArrowRight', 'Home', 'End', ' ', "'", '-'];

                                if (allowed.includes(key)) {
                                    return;
                                }

                                if (!/^[A-Za-zÁÉÍÓÚáéíóúÑñÜü]$/.test(key)) {
                                    event.preventDefault();
                                }
                            });

                            input.addEventListener('input', function () {
                                if (!allowedPattern.test(this.value)) {
                                    this.value = this.value.replace(/[0-9]/g, '').replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñÜü\s'-]/g, '');
                                }
                            });
                        });
                    });
                </script>
            </div>
        </div>
    </div>
</div>
{% endblock %}
